name: Redirect GitHub Pages to loadopoly.com

# The live app now runs in Docker behind loadopoly.com / www.loadopoly.com.
# GitHub Pages only publishes a static redirect so old
# https://loadopoly.github.io/Loadopoly-OCR/ URLs follow the new origin.
# Push this AFTER Cloudflare DNS leaves loadopoly.github.io, or www will
# briefly serve this static page instead of the app.

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages redirect
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
