name: Deploy OCR app to GitHub Pages

# Builds the React app and deploys it to GitHub Pages with Supply-Chain-Brain
# integration (cheap OCR/VLM tier). Set VITE_SCB_OCR_URL as a repository
# variable to enable: Settings → Secrets and variables → Actions → Variables.

on:
  push:
    branches: [main]
    paths: ['src/**', 'index.html', 'package.json', 'vite.config.ts', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Project Pages live under /<repo>/ — derive base path from repo name.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Supabase — set as repository Variables (Settings → Secrets and
          # variables → Actions → Variables). The anon key is public by design.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Supply-Chain-Brain OCR endpoint (optional cheap tier before Gemini)
          VITE_SCB_OCR_URL: ${{ vars.VITE_SCB_OCR_URL }}
        run: npm run build

      - name: SPA fallback (404 → index.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
