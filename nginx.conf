# GeoGraph OCR production build: machamp.loadopoly.com (the landing page is www.loadopoly.com).
server {
    listen 80;
    server_name machamp.loadopoly.com localhost _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # the service worker and the app shell must revalidate, or an update never reaches an installed app
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
