# Named Cloudflare Tunnel for loadopoly.com.
# Credentials live in ./cloudflared/credentials.json (gitignored).
# Create them with: cloudflared tunnel create loadopoly-ocr

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: bakugo.loadopoly.com
    service: http://bakugo:8765
  - hostname: loadopoly.com
    service: http://loadopoly-ocr:3000
  - hostname: www.loadopoly.com
    service: http://loadopoly-ocr:3000
  - service: http_status:404
